name: Release Wheels

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - nightly
          - final
        default: final

permissions:
  contents: write

jobs:
  recover-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Download pyg-lib 0.8.0 wheels
        run: |
          aws s3 cp s3://data.pyg.org/whl/ wheels/ \
            --recursive \
            --exclude '*' \
            --include 'torch-*/pyg_lib-0.8.0+*.whl'

      - name: Validate wheel set
        shell: bash
        run: |
          set -euo pipefail

          expected=()
          add_wheels() {
            local pt="$1"
            shift
            local accelerator
            local arch
            for accelerator in "$@"; do
              for arch in x86_64 aarch64; do
                expected+=("pyg_lib-0.8.0+pt${pt}${accelerator}-cp310-abi3-manylinux_2_27_${arch}.manylinux_2_28_${arch}.whl")
              done
              expected+=("pyg_lib-0.8.0+pt${pt}${accelerator}-cp310-abi3-win_amd64.whl")
            done
            expected+=("pyg_lib-0.8.0+pt${pt}-cp310-abi3-macosx_11_0_arm64.whl")
          }

          add_wheels 210 cpu cu126 cu128 cu130
          add_wheels 211 cpu cu126 cu128 cu130
          add_wheels 212 cpu cu126 cu130 cu132
          add_wheels 213 cpu cu126 cu130 cu132

          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual < <(find wheels -type f -name '*.whl' -printf '%f\n' | sort)

          if [[ ${#actual[@]} -ne 52 ]]; then
            echo "Expected 52 wheels, found ${#actual[@]}"
            exit 1
          fi

          if ! diff -u \
            <(printf '%s\n' "${wanted[@]}") \
            <(printf '%s\n' "${actual[@]}"); then
            echo 'Downloaded wheel set does not match the 0.8.0 release matrix'
            exit 1
          fi

          while IFS= read -r -d '' wheel; do
            unzip -tq "$wheel"
          done < <(find wheels -type f -name '*.whl' -print0)

          mkdir upload
          while IFS= read -r -d '' wheel; do
            cp "$wheel" "upload/$(basename "$wheel")"
          done < <(find wheels -type f -name '*.whl' -print0)

      - name: Upload wheels to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t existing < <(
            gh release view 0.8.0 \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )

          for wheel in upload/*.whl; do
            name="$(basename "$wheel")"
            if printf '%s\n' "${existing[@]}" | grep -Fqx "$name"; then
              echo "Already uploaded: $name"
              continue
            fi

            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload 0.8.0 "$wheel" --repo "$GITHUB_REPOSITORY"; then
                uploaded=true
                break
              fi
              sleep "$((attempt * 5))"
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload $name"
              exit 1
            fi
          done

      - name: Verify GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t local_assets < <(
            find upload -type f -name '*.whl' -printf '%f\n' | sort
          )
          mapfile -t remote_assets < <(
            gh release view 0.8.0 \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name | select(startswith("pyg_lib-0.8.0+"))' \
              | sort
          )

          diff -u \
            <(printf '%s\n' "${local_assets[@]}") \
            <(printf '%s\n' "${remote_assets[@]}")
          echo "Verified ${#remote_assets[@]} pyg-lib 0.8.0 release assets"
